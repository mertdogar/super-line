<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>super-line on Cloudflare</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; background: #fff; }
      form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      input { flex: 1; min-width: 8rem; padding: 0.4rem; }
      #messages { list-style: none; padding: 0; min-height: 12rem; }
      #messages b { margin-right: 0.4rem; }
      #status { color: #666; font-size: 13px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>#general</h1>
    <p id="status">connecting…</p>
    <form id="auth" hidden>
      <input name="email" type="email" placeholder="email" required />
      <input name="password" type="password" placeholder="password (8+ chars)" required minlength="8" />
      <input name="displayName" placeholder="display name (sign up)" />
      <button name="signUp">Sign up</button>
      <button name="signIn">Sign in</button>
    </form>
    <div id="chat" hidden>
      <ul id="messages"></ul>
      <form id="send"><input name="text" placeholder="say something" autocomplete="off" required /><button>Send</button></form>
      <p><button id="signOut">Sign out</button></p>
    </div>
    <script type="module" src="/src/web.ts"></script>
  </body>
</html>
