name: react-chat-transports

# One chat node mounting THREE client↔server transports (WebSocket + HTTP on the http.Server,
# libp2p on a node). The browser's `?transport=` dial picks which wire to dial. No cluster, no broker
# — the point here is three transports to ONE server, not cross-node fan-out.
services:
  # Central Postgres for the per-channel DOCUMENTS only — an append-only log of Yjs deltas, which is a
  # different shape of state from the chat around it and so gets a different backend. `wal_level=logical`
  # is what lets Electric replicate it. (Accounts, channels and messages stay in sqlite below.)
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: electric
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    command: [-c, listen_addresses=*, -c, wal_level=logical]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d electric']
      interval: 2s
      timeout: 3s
      retries: 15

  # Electric streams the op-log out as HTTP shapes into the node's local replica, which is what makes the
  # documents self-clustering: the collection owns its own cross-node sync and needs no super-line adapter.
  electric:
    image: electricsql/electric
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/electric?sslmode=disable
      ELECTRIC_INSECURE: 'true'
    depends_on:
      postgres: { condition: service_healthy }

  node-1:
    build:
      context: ../..
      dockerfile: examples/react-chat-transports/Dockerfile
    image: super-line-react-chat-transports:dev
    environment:
      {
        PORT: '8787',
        P2P_PORT: '9101',
        NODE_NAME: node-1,
        AUTH_JWT_SECRET: dev-only-insecure-shared-secret,
        PG_URL: 'postgres://postgres:password@postgres:5432/electric',
        ELECTRIC_URL: 'http://electric:3000/v1/shape',
      }
    # the libp2p /ws port is dialed DIRECTLY by the browser (not proxied through Caddy)
    ports: ['9101:9101']
    depends_on:
      postgres: { condition: service_healthy }

  # The other backend, and the point of a JWT: it shares exactly ONE thing with node-1 — the signing
  # secret — and deliberately has no super-line, no `PG_URL`, and so no route to the database at all.
  # That is enough for it to trust a caller's identity. Same image, different command.
  verifier:
    build:
      context: ../..
      dockerfile: examples/react-chat-transports/Dockerfile
    image: super-line-react-chat-transports:dev
    command: ['pnpm', '--filter', '@super-line/example-react-chat-transports', 'verifier']
    environment: { VERIFIER_PORT: '8788', AUTH_JWT_SECRET: dev-only-insecure-shared-secret }
    depends_on: [node-1]

  # Caddy: serves the built SPA and reverse-proxies /ws, /superline*, /inspect, /libp2p-addr to the node.
  web:
    build:
      context: ../..
      dockerfile: examples/react-chat-transports/Dockerfile.web
    image: super-line-react-chat-transports-web:dev
    ports: ['8100:8100']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro']
    depends_on: [node-1, verifier]

  # The Control Center webapp on :8101; the browser connects it back to ws://localhost:8100/inspect.
  control-center:
    build:
      context: ../..
      dockerfile: examples/react-chat-transports/Dockerfile.control-center
    image: super-line-react-chat-transports-cc:dev
    ports: ['8101:8101']
    depends_on: [web]
